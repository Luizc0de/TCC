<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar Senha - Insurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-text">Carregando...</div>
        <div class="loader-spinner"></div>
    </div>

    <header id="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Insurance</span>
                </a>
                <div class="header-buttons" id="headerButtons">
                    <a href="login.html" class="btn btn-secondary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-primary">Solicitar Cotação</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-bg" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 20px 60px;">
        <div style="background:white; border-radius:24px; padding:40px 35px; max-width:420px; width:100%; box-shadow:0 25px 60px rgba(6,20,58,0.2);">
            <div style="text-align:center; margin-bottom:25px;">
                <div style="width:65px; height:65px; margin:0 auto 15px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#3b82f6); display:flex; align-items:center; justify-content:center; font-size:28px; color:white;">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 style="color:#06143a; font-size:1.6rem;">Mudar Senha</h2>
                <p style="color:#64748b; font-size:0.9rem; margin-top:5px;">Atualize sua senha de acesso</p>
            </div>

            <div id="mensagem" style="display:none; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:600;"></div>

            <div id="etapaDados">
                <form id="mudarSenhaForm">
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Senha Atual</label>
                        <div style="position:relative;">
                            <input type="password" id="senhaAtual" placeholder="Digite a senha atual" required style="width:100%; padding:13px 45px 13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                            <i class="fa-solid fa-eye" onclick="toggleSenha('senhaAtual', this)" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b; font-size:1rem;"></i>
                        </div>
                    </div>
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Nova Senha</label>
                        <div style="position:relative;">
                            <input type="password" id="novaSenha" placeholder="Digite a nova senha" required style="width:100%; padding:13px 45px 13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                            <i class="fa-solid fa-eye" onclick="toggleSenha('novaSenha', this)" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b; font-size:1rem;"></i>
                        </div>
                    </div>
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Confirmar Nova Senha</label>
                        <div style="position:relative;">
                            <input type="password" id="confirmarSenha" placeholder="Confirme a nova senha" required style="width:100%; padding:13px 45px 13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                            <i class="fa-solid fa-eye" onclick="toggleSenha('confirmarSenha', this)" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b; font-size:1rem;"></i>
                        </div>
                    </div>
                    <button type="submit" style="width:100%; padding:14px; border-radius:12px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); color:white; font-weight:700; font-size:1rem; cursor:pointer; border:none;">Salvar Senha</button>
                </form>
            </div>

            <p style="text-align:center; margin-top:15px;">
                <a href="perfil.html" style="color:#1d4ed8; font-weight:600; text-decoration:none;">← Voltar para o perfil</a>
            </p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
