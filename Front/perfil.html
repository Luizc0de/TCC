<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Insurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-text">Carregando...</div>
        <div class="loader-spinner"></div>
    </div>

    <header id="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Insurance</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="simulador1.html">Simulador</a></li>
                </ul>
                <div class="header-buttons" id="headerButtons">
                    <a href="login.html" class="btn btn-secondary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-primary">Solicitar Cotação</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-bg" style="min-height:100vh; padding:120px 20px 60px; display:flex; justify-content:center; align-items:flex-start;">
        <div style="background:white; border-radius:24px; padding:40px 35px; max-width:500px; width:100%; box-shadow:0 25px 60px rgba(6,20,58,0.25);">
            <div style="text-align:center; margin-bottom:30px;">
                <div id="avatarContainer" style="width:100px; height:100px; margin:0 auto 15px; border-radius:50%; overflow:hidden; border:4px solid #1d4ed8;">
                    <img id="avatarImg" src="images/default-avatar.png" alt="Avatar" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <h1 id="nomeCompleto" style="color:#06143a; font-size:1.8rem; font-weight:800;">Nome do Usuário</h1>
                <p id="emailUsuario" style="color:#64748b; font-size:0.95rem;">email@exemplo.com</p>
            </div>

            <div style="margin-bottom:25px;">
                <div style="display:flex; align-items:center; gap:15px; padding:16px; background:#f8fafc; border-radius:12px; margin-bottom:12px;">
                    <i class="fa-solid fa-user" style="width:40px; height:40px; border-radius:50%; background:#eff6ff; color:#1d4ed8; display:flex; align-items:center; justify-content:center;"></i>
                    <div>
                        <span style="display:block; font-size:0.8rem; color:#64748b;">Nome completo</span>
                        <strong id="infoNome" style="color:#06143a;">-</strong>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:15px; padding:16px; background:#f8fafc; border-radius:12px; margin-bottom:12px;">
                    <i class="fa-solid fa-envelope" style="width:40px; height:40px; border-radius:50%; background:#eff6ff; color:#1d4ed8; display:flex; align-items:center; justify-content:center;"></i>
                    <div>
                        <span style="display:block; font-size:0.8rem; color:#64748b;">E-mail</span>
                        <strong id="infoEmail" style="color:#06143a;">-</strong>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:15px; padding:16px; background:#f8fafc; border-radius:12px;">
                    <i class="fa-solid fa-id-card" style="width:40px; height:40px; border-radius:50%; background:#eff6ff; color:#1d4ed8; display:flex; align-items:center; justify-content:center;"></i>
                    <div>
                        <span style="display:block; font-size:0.8rem; color:#64748b;">CPF</span>
                        <strong id="infoCpf" style="color:#06143a;">-</strong>
                    </div>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:10px;">
                <a href="mudar-email.html" style="display:flex; align-items:center; gap:12px; padding:14px 18px; background:#f8fafc; border-radius:12px; color:#06143a; font-weight:600; text-decoration:none;">
                    <i class="fa-solid fa-envelope" style="color:#1d4ed8;"></i> Mudar Email
                </a>
                <a href="mudar-senha.html" style="display:flex; align-items:center; gap:12px; padding:14px 18px; background:#f8fafc; border-radius:12px; color:#06143a; font-weight:600; text-decoration:none;">
                    <i class="fa-solid fa-lock" style="color:#1d4ed8;"></i> Mudar Senha
                </a>
                <a href="mudar-foto.html" style="display:flex; align-items:center; gap:12px; padding:14px 18px; background:#f8fafc; border-radius:12px; color:#06143a; font-weight:600; text-decoration:none;">
                    <i class="fa-solid fa-camera" style="color:#1d4ed8;"></i> Mudar Foto de Perfil
                </a>
                <a href="#" onclick="logout(event)" style="display:flex; align-items:center; gap:12px; padding:14px 18px; background:#f8fafc; border-radius:12px; color:#06143a; font-weight:600; text-decoration:none;">
                    <i class="fa-solid fa-sign-out" style="color:#1d4ed8;"></i> Sair
                </a>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
