<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Insurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-text">Carregando...</div>
        <div class="loader-spinner"></div>
    </div>

    <header id="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Insurance</span>
                </a>
                <div class="header-buttons" id="headerButtons">
                    <a href="login.html" class="btn btn-secondary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-primary">Solicitar Cotação</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-bg" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 20px 60px;">
        <div style="background:white; border-radius:24px; padding:40px 35px; max-width:480px; width:100%; box-shadow:0 25px 60px rgba(6,20,58,0.2);">
            <div style="text-align:center; margin-bottom:25px;">
                <div style="width:65px; height:65px; margin:0 auto 15px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#3b82f6); display:flex; align-items:center; justify-content:center; font-size:28px; color:white;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 style="color:#06143a; font-size:1.6rem;">Criar conta</h2>
            </div>

            <div id="errorMessage" style="display:none; background:#fee2e2; color:#dc2626; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:600;"></div>
            <div id="successMessage" style="display:none; background:#dcfce7; color:#16a34a; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:600;"></div>

            <form id="cadastroForm">
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Celular</label>
                    <input type="tel" id="celular" placeholder="(11) 99999-9999" maxlength="15" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Senha</label>
                    <input type="password" id="password" placeholder="Crie uma senha" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Confirmar senha</label>
                    <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                </div>
                <button type="submit" style="width:100%; padding:14px; border-radius:12px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); color:white; font-weight:700; font-size:1rem; cursor:pointer; border:none;">Cadastrar</button>
            </form>

            <p style="text-align:center; margin-top:15px; color:#64748b;">
                Já tem conta? <a href="login.html" style="color:#1d4ed8; font-weight:700;">Faça login</a>
            </p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
