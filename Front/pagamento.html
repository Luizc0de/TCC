<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Insurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-text">Carregando...</div>
        <div class="loader-spinner"></div>
    </div>

    <header id="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Insurance</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="simulador1.html">Simulador</a></li>
                    <li><a href="index.html#contato">Contato</a></li>
                </ul>
                <div class="header-buttons" id="headerButtons">
                    <a href="login.html" class="btn btn-secondary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-primary">Solicitar Cotação</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-bg" style="min-height:100vh; padding:120px 20px 60px; display:flex; justify-content:center; align-items:flex-start;">
        <div style="background:white; border-radius:24px; padding:40px 35px; max-width:500px; width:100%; box-shadow:0 25px 60px rgba(6,20,58,0.25);">
            <div style="text-align:center; margin-bottom:30px;">
                <div style="width:65px; height:65px; margin:0 auto 15px; border-radius:50%; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; font-size:28px; color:white;">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <h1 style="color:#06143a; font-size:1.6rem; font-weight:800;">Pagamento</h1>
                <p style="color:#64748b; font-size:0.9rem;">Finalize a contratação do seu plano</p>
            </div>

            <div id="mensagem" style="display:none; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:600;"></div>

            <div style="background:#f8fafc; border-radius:14px; padding:20px; margin-bottom:20px; border:2px solid #e2e8f0;">
                <h3 style="color:#06143a; font-size:1rem; margin-bottom:15px;">Resumo do Plano</h3>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span style="color:#64748b;">Seguro:</span>
                    <span id="resumoSeguro" style="font-weight:700; color:#06143a;">-</span>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <span style="color:#64748b;">Valor:</span>
                    <span id="resumoValor" style="font-weight:800; color:#1d4ed8; font-size:1.2rem;">R$ 0,00</span>
                </div>
            </div>

            <div style="margin-bottom:20px;">
                <label style="display:block; font-weight:700; color:#06143a; margin-bottom:10px;">Forma de Pagamento</label>
                <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
                    <div class="forma-card active" data-forma="pix" style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:15px; background:#eff6ff; border:2px solid #1d4ed8; border-radius:12px; cursor:pointer;">
                        <i class="fa-solid fa-qrcode" style="font-size:1.5rem; color:#1d4ed8;"></i>
                        <span style="font-weight:700; color:#06143a; font-size:0.85rem;">Pix</span>
                    </div>
                    <div class="forma-card" data-forma="cartao" style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:15px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer;">
                        <i class="fa-solid fa-credit-card" style="font-size:1.5rem; color:#1d4ed8;"></i>
                        <span style="font-weight:700; color:#06143a; font-size:0.85rem;">Cartão</span>
                    </div>
                    <div class="forma-card" data-forma="boleto" style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:15px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer;">
                        <i class="fa-solid fa-barcode" style="font-size:1.5rem; color:#1d4ed8;"></i>
                        <span style="font-weight:700; color:#06143a; font-size:0.85rem;">Boleto</span>
                    </div>
                </div>
            </div>

            <button id="btnPagar" style="width:100%; padding:16px; border-radius:12px; background:linear-gradient(135deg,#10b981,#059669); color:white; font-weight:700; font-size:1rem; cursor:pointer; border:none;">Confirmar Pagamento</button>

            <p style="text-align:center; margin-top:20px;">
                <a href="simulador1.html" style="color:#1d4ed8; font-weight:600; text-decoration:none;">← Voltar para o simulador</a>
            </p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
