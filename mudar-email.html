<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar Email - Insurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loader-logo"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="loader-text">Carregando...</div>
        <div class="loader-spinner"></div>
    </div>

    <header id="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Insurance</span>
                </a>
                <div class="header-buttons" id="headerButtons">
                    <a href="login.html" class="btn btn-secondary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-primary">Solicitar Cotação</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-bg" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 20px 60px;">
        <div style="background:white; border-radius:24px; padding:40px 35px; max-width:420px; width:100%; box-shadow:0 25px 60px rgba(6,20,58,0.2);">
            <div style="text-align:center; margin-bottom:25px;">
                <div style="width:65px; height:65px; margin:0 auto 15px; border-radius:50%; background:linear-gradient(135deg,#1d4ed8,#3b82f6); display:flex; align-items:center; justify-content:center; font-size:28px; color:white;">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <h2 style="color:#06143a; font-size:1.6rem;">Mudar Email</h2>
                <p style="color:#64748b; font-size:0.9rem; margin-top:5px;">Atualize seu endereço de e-mail</p>
            </div>

            <div id="mensagem" style="display:none; padding:12px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:600;"></div>

            <div id="etapaDados">
                <form id="mudarEmailForm">
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Novo Email</label>
                        <input type="email" id="novoEmail" placeholder="novo@email.com" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                    </div>
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Senha Atual</label>
                        <input type="password" id="senhaAtual" placeholder="Digite sua senha" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit;">
                    </div>
                    <button type="submit" style="width:100%; padding:14px; border-radius:12px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); color:white; font-weight:700; font-size:1rem; cursor:pointer; border:none;">Salvar Email</button>
                </form>
            </div>

            <div id="etapaCodigo" style="display:none;">
                <p style="text-align:center; color:#64748b; font-size:0.9rem; margin-bottom:15px;">
                    Enviamos um código de confirmação para o seu e-mail.<br>
                    <strong style="color:#06143a;">Abra o console (F12) para ver o código.</strong>
                </p>
                <form id="confirmarCodigoForm">
                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:700; color:#06143a; margin-bottom:8px;">Código de confirmação</label>
                        <input type="text" id="codigoConfirmacao" placeholder="6 dígitos" maxlength="6" required style="width:100%; padding:13px 15px; border:2px solid #e2e8f0; border-radius:12px; font-family:inherit; text-align:center; letter-spacing:8px; font-size:1.2rem; font-weight:700;">
                    </div>
                    <button type="submit" style="width:100%; padding:14px; border-radius:12px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); color:white; font-weight:700; font-size:1rem; cursor:pointer; border:none;">Confirmar</button>
                    <button type="button" id="btnVoltarEditar" style="width:100%; margin-top:10px; padding:12px; border-radius:12px; background:#f1f5f9; color:#06143a; font-weight:600; font-size:0.95rem; cursor:pointer; border:none;">← Voltar e editar</button>
                </form>
            </div>

            <p style="text-align:center; margin-top:15px;">
                <a href="perfil.html" style="color:#1d4ed8; font-weight:600; text-decoration:none;">← Voltar para o perfil</a>
            </p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
